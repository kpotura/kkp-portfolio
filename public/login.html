<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portfolio case study access for Kelley Poturalski." />
  <title>Portfolio Access — Kelley Poturalski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Kelley Poturalski home">KP</a>
    <a class="back-link" href="index.html#work">← Back to work</a>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Portfolio access</p>
      <h1 id="login-title">View case study details.</h1>
      <p class="lede">
        Some project details are password protected to respect client and company confidentiality.
      </p>

      <form class="login-form" action="#" method="post">
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>

        <button class="button primary" type="submit">Sign in</button>
      </form>

      <p class="login-note">
        Need access? Contact Kelley for portfolio credentials.
      </p>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Kelley Poturalski</p>
    <!-- <p>Choose kindness · Stay curious · Do good work, together</p> -->
  </footer>

  <script src="script.js"></script>
</body>
</html>
